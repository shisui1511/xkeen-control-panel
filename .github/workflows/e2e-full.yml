name: E2E Full

# Полный прогон e2e — страховка к выборочному запуску в CI:
# после слияния изменений фронтенда в main и вручную на любой ветке
# (gh workflow run e2e-full.yml --ref <ветка>).
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e-full.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-frontend:
    name: Test Frontend E2E Full (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install chromium

      - name: Run Playwright tests
        run: |
          cd frontend
          npx playwright test --shard=${{ matrix.shard }}/4

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-full-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 30
