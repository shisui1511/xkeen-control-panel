name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия: 0.1.0 — stable, 0.2.0-rc.1 — release candidate"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Push в main: страховочный прогон тестов merge-коммита (PR мог отставать от main)
  # и сигнал для auto-release. Сборки на push нет: RC и stable собираются по тегу,
  # коммит к этому моменту уже зелёный, поэтому тесты там не повторяются.
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.event_name == 'push' && github.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      # go:embed требует frontend/dist; тестам сборка не нужна
      - name: Stub frontend for go:embed
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Run Go vet
        run: go vet ./...

  # Версия и фронтенд готовятся один раз, матрица архитектур берёт их артефактом.
  # Сборка — только для RC и stable: по тегу (auto-release или человек) или вручную.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag')
    outputs:
      version: ${{ steps.version.outputs.version }}
      kind: ${{ steps.version.outputs.kind }}
      pr_number: ${{ steps.version.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Calculate version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # KIND: rc — release candidate, stable — релиз. Собираются одинаково; RC
          # публикуется как pre-release: в beta тестируется ровно тот бинарник,
          # который станет стабильным.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            KIND="rc"
          elif echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            KIND="stable"
          else
            echo "::error::Версия '${VERSION}' — ни vX.Y.Z, ни vX.Y.Z-rc.N"
            exit 1
          fi
          PR_NUMBER=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].number' 2>/dev/null || echo "")
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "kind=${KIND}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION} (kind=${KIND}, pr=${PR_NUMBER})"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        env:
          # Имя кэша Service Worker берётся из версии сборки
          XCP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build:
    name: Build
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - GOARCH: arm64
            name: arm64
            qemu: qemu-aarch64-static
          - GOARCH: mipsle
            GOMIPS: softfloat
            name: mipsle
            qemu: qemu-mipsel-static
          - GOARCH: mips
            GOMIPS: softfloat
            name: mips
            qemu: qemu-mips-static
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.GOARCH }}
          GOMIPS: ${{ matrix.GOMIPS }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${VERSION}" \
            -o build/xcp_${VERSION}_${{ matrix.name }} ./cmd/xcp

      - name: Install QEMU and tools
        run: |
          ok=0
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y qemu-user-static && { ok=1; break; }
            echo "apt-get failed, retry $i"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::apt-get failed after 3 attempts"; exit 1; }

      - name: Verify static linkage
        run: |
          file "build/xcp_${VERSION}_${{ matrix.name }}"
          file "build/xcp_${VERSION}_${{ matrix.name }}" | grep -q "statically linked"

      - name: Smoke test under QEMU
        timeout-minutes: 1
        run: |
          ACTUAL=$(${{ matrix.qemu }} "./build/xcp_${VERSION}_${{ matrix.name }}" -v)
          echo "xcp -v: ${ACTUAL}"
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::Бинарник сообщает версию '${ACTUAL}', ожидалась '${VERSION}'"
            exit 1
          fi

      - name: Generate checksum
        run: |
          cd build
          sha256sum xcp_${VERSION}_${{ matrix.name }} > xcp_${VERSION}_${{ matrix.name }}.sha256

      # Сжатие только для скачивания: панель и setup.sh распаковывают .gz и сверяют
      # SHA-256 несжатого бинарника. UPX не используется — распакованный в RAM образ
      # занимал ~20 МБ на роутере.
      - name: Compress for download
        run: |
          gzip -9 -n -k "build/xcp_${VERSION}_${{ matrix.name }}"
          ls -l build/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xcp_${{ matrix.name }}
          path: |
            build/xcp_${{ env.VERSION }}_${{ matrix.name }}
            build/xcp_${{ env.VERSION }}_${{ matrix.name }}.gz
            build/xcp_${{ env.VERSION }}_${{ matrix.name }}.sha256

  release:
    name: Create Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create stable release or release candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          MODE: ${{ needs.prepare.outputs.kind }}
          SOAK_HOURS: ${{ vars.RC_SOAK_HOURS || '24' }}
        run: |
          if [ "$MODE" = rc ]; then
            PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
            PRERELEASE="--prerelease"
          else
            PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'
            PRERELEASE=""
          fi
          if echo "$VERSION" | grep -qvE "$PATTERN"; then
            echo "ERROR: Invalid ${MODE} version format: $VERSION"
            exit 1
          fi

          python3 .github/scripts/gen_notes.py

          # Тег ставит auto-release (или человек) до сборки — релиз создаётся по нему,
          # без --target. С --target на коммит, чьи workflow-файлы отличаются от main
          # (RC/stable со старого коммита), GitHub отвечает GITHUB_TOKEN 403
          # «Resource not accessible by integration» — так упал v0.29.0-rc.2.
          TARGET="--target ${GITHUB_SHA}"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            TARGET="--verify-tag"
          fi

          # shellcheck disable=SC2086 # PRERELEASE пустой для stable, TARGET — два слова
          gh release create "${VERSION}" \
            $TARGET \
            --title "${VERSION}" \
            --notes-file /tmp/release-notes.md \
            $PRERELEASE \
            artifacts/xcp_*/xcp_"${VERSION}"_*

          # Dev-сборки и RC не новее выпущенной версии устарели, включая осиротевшие теги
          if [ "$MODE" = stable ]; then
            bash .github/scripts/prune_dev_releases.sh "${VERSION}"
          fi

  cleanup:
    name: Cleanup artifacts
    runs-on: ubuntu-latest
    needs: release
    if: always() && github.actor != 'dependabot[bot]' && (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag')
    steps:
      - uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            xcp_*
            frontend-dist
