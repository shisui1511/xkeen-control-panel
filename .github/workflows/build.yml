name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия: 0.1.0 — stable, 0.2.0-rc.1 — release candidate"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Run Go vet
        run: go vet ./...

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    strategy:
      matrix:
        include:
          - GOARCH: arm64
            name: arm64
            qemu: qemu-aarch64-static
          - GOARCH: mipsle
            GOMIPS: softfloat
            name: mipsle
            qemu: qemu-mipsel-static
          - GOARCH: mips
            GOMIPS: softfloat
            name: mips
            qemu: qemu-mips-static

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # KIND: dev — rolling pre-release, rc — release candidate, stable — релиз.
          # Все собираются одинаково; RC публикуется как pre-release: в beta
          # тестируется ровно тот бинарник, который станет стабильным.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${INPUT_VERSION#v}"
            BUILD_VERSION="$VERSION"
            if echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
              KIND="rc"
            elif echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              KIND="stable"
            else
              echo "::error::Версия '${VERSION}' — ни vX.Y.Z, ни vX.Y.Z-rc.N"
              exit 1
            fi
            SKIP="false"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            BUILD_VERSION="$VERSION"
            KIND="stable"
            SKIP="false"
          else
            # Проверяем, не запущен ли рабочий процесс для ветки main, но при этом текущий коммит уже протегирован стабильной версией
            EXACT_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
            if echo "$EXACT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "HEAD is exactly tagged as stable ($EXACT_TAG). Skipping redundant branch-triggered build."
              SKIP="true"
              VERSION="$EXACT_TAG"
              BUILD_VERSION="$VERSION"
              KIND="stable"
            else
              SKIP="false"
              
              # Единый источник версии (как локально в Makefile):
              #   VERSION       — канал rolling pre-release (тег и имена ассетов), vX.Y.Z-dev
              #   BUILD_VERSION — версия внутри бинарника, vX.Y.Z-dev.N+g<sha>
              # X.Y.Z — следующий релиз по conventional commits после последнего тега.
              VERSION=$(sh scripts/version.sh --channel)
              BUILD_VERSION=$(sh scripts/version.sh)
              KIND="dev"
              LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' 2>/dev/null || echo "")

              # Calculate commit count since the last stable tag for build notes
              if [ -n "$LATEST_TAG" ]; then
                RANGE="${LATEST_TAG}..HEAD"
              else
                RANGE="HEAD"
              fi
              COMMIT_COUNT=$(git rev-list "$RANGE" --count 2>/dev/null || git rev-list HEAD --count)
              echo "commit_count=${COMMIT_COUNT}" >> $GITHUB_OUTPUT
            fi
          fi
          
          PR_NUMBER=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].number' 2>/dev/null || echo "")
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "kind=${KIND}" >> $GITHUB_OUTPUT
          echo "skip=${SKIP}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}, build ${BUILD_VERSION} (kind=${KIND}, pr=${PR_NUMBER}, skip=${SKIP})"

      - name: Set up Node.js
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: steps.version.outputs.skip != 'true'
        env:
          # Имя кэша Service Worker берётся из версии сборки
          XCP_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Go
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Build binary
        if: steps.version.outputs.skip != 'true'
        env:
          GOOS: linux
          GOARCH: ${{ matrix.GOARCH }}
          GOMIPS: ${{ matrix.GOMIPS }}
          CGO_ENABLED: 0
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          go build -ldflags="-s -w -X main.Version=${BUILD_VERSION}" \
            -o build/xcp_${VERSION}_${{ matrix.name }} ./cmd/xcp

      - name: Install QEMU and tools
        if: steps.version.outputs.skip != 'true'
        run: |
          ok=0
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y qemu-user-static && { ok=1; break; }
            echo "apt-get failed, retry $i"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::apt-get failed after 3 attempts"; exit 1; }

      - name: Verify static linkage
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          file "build/xcp_${VERSION}_${{ matrix.name }}"
          file "build/xcp_${VERSION}_${{ matrix.name }}" | grep -q "statically linked"

      - name: Smoke test under QEMU
        if: steps.version.outputs.skip != 'true'
        timeout-minutes: 1
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          ACTUAL=$(${{ matrix.qemu }} "./build/xcp_${VERSION}_${{ matrix.name }}" -v)
          echo "xcp -v: ${ACTUAL}"
          if [ "$ACTUAL" != "$BUILD_VERSION" ]; then
            echo "::error::Бинарник сообщает версию '${ACTUAL}', ожидалась '${BUILD_VERSION}'"
            exit 1
          fi

      - name: Generate checksum
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd build
          sha256sum xcp_${VERSION}_${{ matrix.name }} > xcp_${VERSION}_${{ matrix.name }}.sha256

      # Сжатие только для скачивания: панель и setup.sh распаковывают .gz и сверяют
      # SHA-256 несжатого бинарника. UPX не используется — распакованный в RAM образ
      # занимал ~20 МБ на роутере и делал dev-сборки непохожими на stable.
      - name: Compress for download
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gzip -9 -n -k "build/xcp_${VERSION}_${{ matrix.name }}"
          ls -l build/

      - name: Upload artifact
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xcp_${{ matrix.name }}
          path: |
            build/xcp_${{ steps.version.outputs.version }}_${{ matrix.name }}
            build/xcp_${{ steps.version.outputs.version }}_${{ matrix.name }}.gz
            build/xcp_${{ steps.version.outputs.version }}_${{ matrix.name }}.sha256

    outputs:
      version: ${{ steps.version.outputs.version }}
      kind: ${{ steps.version.outputs.kind }}
      commit_count: ${{ steps.version.outputs.commit_count }}
      pr_number: ${{ steps.version.outputs.pr_number }}
      skip: ${{ steps.version.outputs.skip }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && needs.build.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Rolling pre-release
        id: rolling
        if: needs.build.outputs.kind == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT_COUNT: ${{ needs.build.outputs.commit_count }}
          PR_NUMBER: ${{ needs.build.outputs.pr_number }}
          MODE: prerelease
        run: |
          # Пока шла сборка, мог выйти stable-релиз той же или более новой версии
          BASE="${VERSION#v}"
          BASE="${BASE%-dev}"
          LATEST_TAG=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          LATEST="${LATEST_TAG#v}"
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$BASE" "$LATEST" | sort -V | tail -1)" = "$LATEST" ]; then
            echo "${VERSION} не новее ${LATEST_TAG}, pre-release не публикуется"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 .github/scripts/gen_notes.py

          # Rolling pre-release всегда один: убираем прежний и все устаревшие dev-релизы
          bash .github/scripts/prune_dev_releases.sh
          git tag -d "${VERSION}" 2>/dev/null || true

          # Создаём новый tag на текущем HEAD (force на случай race condition)
          git tag -f "${VERSION}" "${GITHUB_SHA}"
          git push origin -f "${VERSION}"

          TITLE="${VERSION} · build #${COMMIT_COUNT}"

          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "${TITLE}" \
            --notes-file /tmp/release-notes.md \
            --prerelease \
            artifacts/xcp_*/xcp_"${VERSION}"_*

      - name: Create stable release or release candidate
        if: needs.build.outputs.kind != 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          PR_NUMBER: ${{ needs.build.outputs.pr_number }}
          MODE: ${{ needs.build.outputs.kind }}
          SOAK_HOURS: ${{ vars.RC_SOAK_HOURS || '24' }}
        run: |
          if [ "$MODE" = rc ]; then
            PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
            PRERELEASE="--prerelease"
          else
            PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'
            PRERELEASE=""
          fi
          if echo "$VERSION" | grep -qvE "$PATTERN"; then
            echo "ERROR: Invalid ${MODE} version format: $VERSION"
            exit 1
          fi

          python3 .github/scripts/gen_notes.py

          # Тег ставит auto-release (или человек) до сборки — релиз создаётся по нему,
          # без --target. С --target на коммит, чьи workflow-файлы отличаются от main
          # (RC/stable со старого коммита), GitHub отвечает GITHUB_TOKEN 403
          # «Resource not accessible by integration» — так упал v0.29.0-rc.2.
          TARGET="--target ${GITHUB_SHA}"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            TARGET="--verify-tag"
          fi

          # shellcheck disable=SC2086 # PRERELEASE пустой для stable, TARGET — два слова
          gh release create "${VERSION}" \
            $TARGET \
            --title "${VERSION}" \
            --notes-file /tmp/release-notes.md \
            $PRERELEASE \
            artifacts/xcp_*/xcp_"${VERSION}"_*

          # Dev-сборки и RC не новее выпущенной версии устарели, включая осиротевшие теги
          if [ "$MODE" = stable ]; then
            bash .github/scripts/prune_dev_releases.sh "${VERSION}"
          fi

      - name: Update binaries branch
        # Зеркало setup.sh держит только stable и dev, RC туда не попадает
        if: needs.build.outputs.kind != 'rc' && steps.rolling.outputs.published != 'false'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          bash .github/scripts/update_binaries.sh "${VERSION}" artifacts

  cleanup:
    name: Cleanup artifacts
    runs-on: ubuntu-latest
    needs: release
    if: always() && github.actor != 'dependabot[bot]'
    steps:
      - uses: geekyeggo/delete-artifact@v6
        with:
          name: xcp_*
