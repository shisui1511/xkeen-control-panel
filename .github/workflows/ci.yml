name: CI

# Запускается только на pull requests
on:
  pull_request:
    branches:
      - main
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Отменяет предыдущие запуски для того же PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Job 1: Линтинг Go кода
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Frontend нужен для go:embed (embed.go ссылается на frontend/dist)
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Download Go dependencies
        env:
          GOTOOLCHAIN: local
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2 # точный пин релиза golangci-lint; совместим с Go 1.26
          install-mode: binary
          args: --timeout=5m

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          repo-checkout: false
          # Проверяется то, что попадает в бинарник: граф пакетов от cmd/.
          # Тестовые хелперы (internal/xrayapi/testutil поднимает gRPC-сервер
          # для моков) импортируются только из _test.go и в сборку не входят.
          go-package: ./cmd/...

  # Job 2: Тестирование Go кода
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Frontend нужен для go:embed
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Download dependencies
        env:
          GOTOOLCHAIN: local
        run: go mod download

      - name: Run tests
        run: go test -race -v -coverprofile=coverage.out ./...

      - name: Verify test coverage thresholds
        run: ./scripts/check-coverage.sh coverage.out

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

      - name: Display coverage
        run: go tool cover -func=coverage.out

  # Job 3: Линтинг и сборка Frontend
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Check Formatting
        run: |
          cd frontend
          npm run format:check

      - name: Lint Svelte & TypeScript
        run: |
          cd frontend
          npm run lint

      - name: Check token contrast (WCAG AA)
        run: |
          cd frontend
          npm run check:contrast

      - name: Check i18n translations
        run: |
          cd frontend
          npm run check:i18n

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test:unit

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Check bundle size budget (<=200 KB gzip)
        run: |
          cd frontend
          npm run check:bundle-size

      - name: Report bundle size
        uses: preactjs/compressed-size-action@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          cwd: frontend
          pattern: "dist/assets/*.{js,css}"
          strip-hash: "-[a-zA-Z0-9_-]{8}"
          build-script: "npm run build"

  # Job 4a: Выбор e2e-спеков по изменённым файлам
  # Граф импортов фронтенда строится заново (frontend/scripts/select-e2e.mjs):
  # запускаются только спеки страниц, которые затрагивает PR. Изменения
  # оболочки приложения, хелперов тестов и конфигов запускают все спеки.
  e2e-plan:
    name: E2E Plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      specs: ${{ steps.plan.outputs.specs }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_total: ${{ steps.plan.outputs.shard_total }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Select specs
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node frontend/scripts/select-e2e.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output

  # Job 4b: Тестирование Frontend (E2E) — выбранные спеки, по шардам
  test-frontend:
    name: Test Frontend E2E (${{ matrix.shard }}/${{ needs.e2e-plan.outputs.shard_total }})
    needs: e2e-plan
    if: needs.e2e-plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install chromium

      # Бэкенд и сборка не нужны: спеки мокают API через page.route и
      # работают через Vite dev-сервер (webServer в playwright.config.ts)
      - name: Run Playwright tests
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.e2e-plan.outputs.shard_total }}
          # Имена файлов из PR — только через env, не подстановкой в скрипт
          SPECS: ${{ needs.e2e-plan.outputs.specs }}
        run: |
          cd frontend
          # shellcheck disable=SC2086 # SPECS — список через пробел
          npx playwright test --shard="$SHARD" $SPECS

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 30

  # Job 5: Проверка сборки
  build-check:
    name: Build Check
    needs: [lint-go, test-go, lint-frontend, e2e-plan, test-frontend, check-rules]
    # test-frontend пропускается, если PR не затрагивает фронтенд
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - GOARCH: arm64
            name: arm64
            qemu: qemu-aarch64-static
          - GOARCH: mipsle
            GOMIPS: softfloat
            name: mipsle
            qemu: qemu-mipsel-static
          - GOARCH: mips
            GOMIPS: softfloat
            name: mips
            qemu: qemu-mips-static

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.GOARCH }}
          GOMIPS: ${{ matrix.GOMIPS }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=ci-test" \
            -o xcp-${{ matrix.name }} ./cmd/xcp

      - name: Check binary size
        run: |
          SIZE=$(stat -c%s "xcp-${{ matrix.name }}")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          
          # Предупреждение если бинарник больше 50MB
          if [ $SIZE_MB -gt 50 ]; then
            echo "::warning::Binary size is larger than 50MB: ${SIZE_MB}MB"
          fi

      - name: Install QEMU and tools
        run: |
          ok=0
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y qemu-user-static upx-ucl && { ok=1; break; }
            echo "apt-get failed, retry $i"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::apt-get failed after 3 attempts"; exit 1; }

      - name: Verify static linkage
        run: |
          file "xcp-${{ matrix.name }}"
          file "xcp-${{ matrix.name }}" | grep -q "statically linked"

      - name: Smoke test under QEMU (uncompressed)
        timeout-minutes: 1
        run: |
          ${{ matrix.qemu }} "./xcp-${{ matrix.name }}" -v

      - name: Test UPX compression & execution under QEMU
        continue-on-error: true
        timeout-minutes: 1
        run: |
          upx -9 --lzma "xcp-${{ matrix.name }}" -o "xcp-${{ matrix.name }}-upx"
          file "xcp-${{ matrix.name }}-upx"
          ${{ matrix.qemu }} "./xcp-${{ matrix.name }}-upx" -v

  # Job 6: Проверка правил коммитов и синхронизации локализации
  check-rules:
    name: Verify Commits & i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check i18n translations
        run: node scripts/check-i18n.js

      - name: Check frontend API calls against backend routes
        run: node scripts/check-api-routes.js

      - name: Test version script
        run: |
          sh scripts/version_test.sh
          echo "Build version: $(sh scripts/version.sh), next release: $(sh scripts/version.sh --next)"

      - name: Check commit messages
        run: |
          node scripts/check-commits.js "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
