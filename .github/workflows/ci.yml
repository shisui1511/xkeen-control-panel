name: CI

# Запускается только на pull requests
on:
  pull_request:
    branches:
      - main
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Отменяет предыдущие запуски для того же PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Job 0: что затронул PR — по этому решается, какие проверки нужны.
  # Правка доков, скриптов и других workflow не запускает ни Go-, ни фронтенд-джобы;
  # проверки правил коммитов и i18n (check-rules) идут всегда.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.scope.outputs.go }}
      frontend: ${{ steps.scope.outputs.frontend }}
      build: ${{ steps.scope.outputs.build }}
      build_matrix: ${{ steps.scope.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "$files"
          go=false; frontend=false
          # Правка самого ci.yml проверяет всё
          if echo "$files" | grep -qE '^(internal|cmd)/|\.go$|^go\.(mod|sum)$|^\.golangci|^\.github/workflows/ci\.yml$'; then go=true; fi
          if echo "$files" | grep -qE '^frontend/|^\.github/workflows/ci\.yml$'; then frontend=true; fi
          build=false
          if [ "$go" = true ] || [ "$frontend" = true ]; then build=true; fi
          # Go-код не менялся — достаточно одной архитектуры (размер встроенного фронтенда, запуск);
          # все три собираются при правке Go и на теге
          if [ "$go" = true ]; then
            matrix='{"include":[{"GOARCH":"arm64","name":"arm64"},{"GOARCH":"mipsle","GOMIPS":"softfloat","name":"mipsle"},{"GOARCH":"mips","GOMIPS":"softfloat","name":"mips"}]}'
          else
            matrix='{"include":[{"GOARCH":"arm64","name":"arm64"}]}'
          fi
          {
            echo "go=$go"
            echo "frontend=$frontend"
            echo "build=$build"
            echo "build_matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  # Job 1: Линтинг Go кода
  lint-go:
    name: Lint Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # go:embed требует frontend/dist; линтеру сборка не нужна
      - name: Stub frontend for go:embed
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Download Go dependencies
        env:
          GOTOOLCHAIN: local
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0 # точный пин релиза golangci-lint; совместим с Go 1.27
          install-mode: binary
          args: --timeout=5m

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          repo-checkout: false
          # Проверяется то, что попадает в бинарник: граф пакетов от cmd/.
          go-package: ./cmd/...

  # Job 3: Линтинг и сборка Frontend
  lint-frontend:
    name: Lint Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Check Formatting
        run: |
          cd frontend
          npm run format:check

      - name: Lint Svelte & TypeScript
        run: |
          cd frontend
          npm run lint

      - name: Check token contrast (WCAG AA)
        run: |
          cd frontend
          npm run check:contrast

      - name: Check i18n translations
        run: |
          cd frontend
          npm run check:i18n

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      # Сборка переиспользуется в Build Check вместо трёх пересборок
      - name: Upload frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

      - name: Check bundle size budget (<=200 KB gzip)
        run: |
          cd frontend
          npm run check:bundle-size

      - name: Report bundle size
        uses: preactjs/compressed-size-action@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          cwd: frontend
          pattern: "dist/assets/*.{js,css}"
          strip-hash: "-[a-zA-Z0-9_-]{8}"
          build-script: "npm run build"

  # Job 5: Проверка сборки
  build-check:
    name: Build Check
    # Нужен только артефакт фронтенда от lint-frontend; остальные проверки идут параллельно.
    # Итог PR всё равно требует зелёных обязательных проверок — они отдельные.
    needs: [changes, lint-frontend]
    if: ${{ !cancelled() && needs.changes.outputs.build == 'true' && needs.lint-frontend.result != 'failure' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix) }}

    steps:
      - uses: actions/checkout@v7

      # Фронтенд не менялся — lint-frontend пропущен, артефакта нет, достаточно заглушки для go:embed
      - name: Download frontend
        if: needs.lint-frontend.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Stub frontend for go:embed
        if: needs.lint-frontend.result != 'success'
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.GOARCH }}
          GOMIPS: ${{ matrix.GOMIPS }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=ci-test" \
            -o xcp-${{ matrix.name }} ./cmd/xcp

      - name: Check binary size
        run: |
          SIZE=$(stat -c%s "xcp-${{ matrix.name }}")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          
          # Предупреждение если бинарник больше 50MB
          if [ $SIZE_MB -gt 50 ]; then
            echo "::warning::Binary size is larger than 50MB: ${SIZE_MB}MB"
          fi

      - name: Verify static linkage
        run: |
          file "xcp-${{ matrix.name }}"
          file "xcp-${{ matrix.name }}" | grep -q "statically linked"

  # Job 6: Проверка правил коммитов и синхронизации локализации
  check-rules:
    name: Verify Commits & i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check i18n translations
        run: node scripts/check-i18n.js

      - name: Check frontend API calls against backend routes
        run: node scripts/check-api-routes.js

      - name: Show build version
        run: |
          echo "Build version: $(sh scripts/version.sh), next release: $(sh scripts/version.sh --next)"

      - name: Check commit messages
        run: |
          node scripts/check-commits.js "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # Job 7: Гейт «тесты только на роутере» и статические стражи.
  # Без условий и needs: запускается в каждом PR, имя job — обязательная проверка ruleset.
  check-no-simulations:
    name: check-no-simulations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check no simulations
        run: node scripts/check-no-simulations.js

      - name: Check kernel gate routes
        run: node scripts/check-kernel-routes.js

      - name: Check Xray protocols
        run: node scripts/check-xray-protocols.js

      - name: Check password blacklist
        run: node scripts/check-password-blacklist.js

      - name: Check kernel guard
        run: node scripts/check-kernel-guard.js
