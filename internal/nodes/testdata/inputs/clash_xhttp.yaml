proxies:
  - name: "Узел xhttp"
    type: vless
    server: node1.example
    port: 443
    uuid: 11111111-1111-4111-8111-111111111111
    network: xhttp
    tls: true
    udp: true
    packet-encoding: xudp
    flow: ""
    encryption: none
    servername: cdn.example
    client-fingerprint: chrome
    alpn:
      - h2
      - http/1.1
    xhttp-opts:
      path: /xh
      host: cdn.example
      mode: stream-up
      x-padding-bytes: "100-1000"
      no-grpc-header: true
      reuse-settings:
        max-concurrency: "16-32"
        max-connections: "0"
