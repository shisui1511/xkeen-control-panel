# ==============================================================================
# full-tunnel.yaml — Полный туннель
# Сценарий: Весь интернет-трафик через прокси, локальная сеть и управление напрямую.
# В отличие от global-proxy.yaml (mode: global), использует mode: rule с явными
# исключениями приватных сетей, системного резолвера и портов управления Keenetic.
# Пользователь добавляет proxy-providers через страницу Subscriptions.
# Требует Mihomo Meta >= 1.15 (поддержка include-all: true).
# ==============================================================================
mixed-port: 7890
redir-port: 5000
tproxy-port: 5001
routing-mark: 255
allow-lan: true
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: off

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.keenetic.pro"
    - "*.keenetic.link"
    - "*.keenetic.name"
    - "*.my.keenetic.net"
    - "router.local"
    - "127.0.0.53"
  default-nameserver:
    - 77.88.8.8
    - 1.1.1.1
  nameserver:
    - 77.88.8.8
    - https://common.dot.dns.yandex.net/dns-query
  fallback:
    - https://cloudflare-dns.com/dns-query

sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]

proxy-providers:
  sub:
    type: http
    url: "https://example.com/sub"
    interval: 86400
    path: ./providers/sub.yaml
    header:
      User-Agent:
        - "Mihomo"
      x-hwid:
        - "keenetic-router-hwid"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      udp: true
      tfo: true

proxy-groups:
  - name: "Full-Proxy"
    type: select
    include-all: true
    proxies:
      - DIRECT

rules:
  # Защита портов управления роутером и удаленного доступа — строго DIRECT
  - DST-PORT,3389,DIRECT
  - DST-PORT,22,DIRECT
  - DST-PORT,445,DIRECT
  - DST-PORT,1194,DIRECT
  - DST-PORT,51820,DIRECT

  # Приватные адреса и локальные сервисы Keenetic — строго DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve

  # Весь остальной трафик идет через прокси-туннель
  - MATCH,Full-Proxy
